services:
  wechat-redeem:
    build: .
    container_name: wechat-redeem
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - /opt/wechat-redeem/data:/data
    env_file:
      - .env
    environment:
      - DB_PATH=/data/wechat_redeem.db
      # 生产域名（逗号分隔），用于 Host 头校验；经 CF Tunnel 接入时填公网域名
      # - ALLOWED_HOSTS=wx.example.com
